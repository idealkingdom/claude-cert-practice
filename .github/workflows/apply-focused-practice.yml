name: Apply focused practice

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-focused-practice.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install focused-practice app
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > app.js
          sed -i "s/claude-cert-v3/claude-cert-v4/" sw.js
          node --check app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js sw.js
          git commit -m 'Add batch sizes and domain-focused practice'
          git push origin HEAD:main
