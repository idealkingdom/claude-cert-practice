name: Academy updater
on:
  push:
    paths:
      - '.github/workflows/academy-updater.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install academy bundle
        shell: bash
        run: |
          cat .academy-bundle/00 .academy-bundle/01 .academy-bundle/02 .academy-bundle/03 .academy-bundle/04 .academy-bundle/05 > /tmp/academy_bundle.b64
          base64 -d /tmp/academy_bundle.b64 > /tmp/academy_bundle.tar.gz
          echo '59e11aebc5b9d54867fb731e92bd9b724facdb74df5172ac55079874ee12c704  /tmp/academy_bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/academy_bundle.tar.gz -C .
          rm -rf .academy-bundle .github/workflows/academy-updater.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add source-backed certification academy'
          git push
