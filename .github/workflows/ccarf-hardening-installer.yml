name: Install CCAR-F hardening
on:
  push:
    paths:
      - '.github/workflows/ccarf-hardening-installer.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and install CCAR-F bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .ccarf_stage/part00 .ccarf_stage/part01 .ccarf_stage/part02 .ccarf_stage/part03 > /tmp/ccarf_bundle.b64
          base64 -d /tmp/ccarf_bundle.b64 > /tmp/ccarf_bundle.tar.gz
          echo 'aa9e3a2374a613fe232bd27148be6556fcce38baf35b18e1e6c467b9007bf2df  /tmp/ccarf_bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ccarf_bundle.tar.gz -C .
          node --check ccarf-final-bank.js
          node --check ccarf-final.js
          node --check ccarf-labs.js
          node --check ccarf-link.js
          test -s ccarf-final.html
          test -s ccarf-labs.html
          grep -q 'claude-cert-v7' sw.js
          grep -q 'ccarf-link.js' index.html
          grep -q 'ccarf-link.js' learn.html
          rm -rf .ccarf_stage
          rm .github/workflows/ccarf-hardening-installer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add sealed CCAR-F final gate and hands-on labs'
          git push
